title = "安装目录回退顺序 (install dir fallback)"
description = "阈值探测。在一组真实镜像上（root、非 root、只读 rootfs、noexec 挂载）测出「可写且可执行」的安装目录顺序。"
verify = "产出一张表：每类镜像下按顺序尝试的路径、命中哪一个、失败原因；R5 的验收按这张表收紧。"
covers = ["R5"]
after = []
hitl = false
risk = "medium"
refine = true

