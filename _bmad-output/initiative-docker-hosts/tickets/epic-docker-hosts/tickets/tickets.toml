# next_id = 14

[[entry]]
id = 1
type = "story"
title = "tracer: 按容器名或 ID 接入、确认装机、进 workspace、断开后进程退出"
description = "打通一条最薄的完整路径：手动输入容器名或 ID → 路由进容器 → 首次装机弹确认（拒绝时不写入）→ 进入 workspace → 关闭后容器内进程退出。列表、架构选择、目录回退这一轮都先走单一路径。需要一台有 docker 的机器，以及一个没有 sshd 的运行中容器（例如 `docker compose up -d` 起的开发容器）。"
verify = "在有 docker 的机器上按容器名接入一个无 sshd 的容器：出现装机确认，拒绝时容器内无文件写入；允许后能在 pane 里执行命令；关闭 workspace 后 `docker exec <容器> pgrep -f tty7-server` 无输出。"
covers = ["R1", "R3", "R9"]
after = []
hitl = true
risk = "high"

[[entry]]
id = 2
type = "spike"
title = "强杀客户端后容器内进程的退出上界 (kill-9 bound)"
description = "阈值探测。测出 docker exec 通道在正常关闭、连接中断、kill -9 三种情形下，容器内 tty7-server 退出的时间上界。放在最前，因为这是全 epic 最不确定的一处。"
verify = "给出三种情形各自的时间（或「不退出」），R9 的验收写上具体秒数。"
covers = ["R9"]
after = []
hitl = false
risk = "high"
refine = true

