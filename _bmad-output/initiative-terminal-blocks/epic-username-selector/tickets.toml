type = "story"
title = "core delete op plus probe plus memory guard"
description = "Adds remove_instance and remove_instance_in (validate, authoritative probe, unlink; refuses symlinked dirs and the default sentinel), the dir-scoped tri-state holder probe in the instance module, shape validation inside write_last_in, unit tests, and logging (warn on refused or failed removes, info on success)."
verify = "cargo test is green including live-seat refusal, unknown-state, invalid, sentinel, and symlink cases."
covers = ["CAP-4"]
after = [1]
hitl = false
risk = "medium"

