# tickets.toml — a container's agreed children. tickets.py reads it.
# The order of the tables is the build order: move a table to reorder. `id` names a child for good and is never reused; it is not an order.

[[entry]]
id = 1
type = "story"
title = "mtime recency tracer"
description = "Snapshots (name, mtime) pairs once per open in the instance module, orders mtime-descending with name-ascending tie-break, omits meta when the filesystem cannot supply it, and renders the relative-time row meta in the picker. Tracer: thinnest core-to-UI path."
verify = "A multi-user box shows relative times newest-first and stable; cargo test covers ordering, tie-break, and omit."
covers = ["CAP-6"]
after = []
hitl = false
risk = "low"

[[entry]]
