# tickets.toml — a container's agreed children. tickets.py reads it.
# The order of the tables is the build order: move a table to reorder. `id` names a child for good and is never reused; it is not an order.
# Status never lives here: an entry with no plan and no leaf file is planned.

[[entry]]
id = 1
type = "story"
title = "块模型 tracer：配对建块贯通折叠与菜单脚手架"
description = "Server 侧 B→D 配对建块（含 exit_code 解析与退出码行格式，alt-screen 排除，无 marks 不分块），gutter 折叠/展开打通，右键菜单脚手架（跳块首、复制两者）接同一块 id。拥有 block schema（id/exit_code/folded/truncated）与退出码语义，后续 entries 只消费。"
verify = "万行输出块 gutter 点折只占一行、展开无损；无 marks 的 pane 不分块；菜单两项可点通。"
covers = ["CAP-1"]
after = []
hitl = false
risk = "medium"

