  risks:
    - text: Mirror is never cleared on disconnect (no machines.remove in
        machine_mirror.rs; RemoteLinks::disconnect only drops
        RemoteLinks/HostLinks state), so a stale mirror can show ghost adopt
        rows in an offline/parked group until a fresh pull replaces data.
      truncated: false
    - text: Adopt rows from the mirror hardcode live Liveness::Stopped (same as
        snapshot rows) even while connected.
      truncated: false
    - text: New A1 test seeds the mirror via MachineMirrors::install rather than
        driving a live WorkspaceCreated delta; the delta path itself is covered
        by existing machine_mirror apply() unit tests, and no live-GUI check was
        performed.
      truncated: false
