acceptance:
  - id: A1
    source: brief.md
    text: "A1: In an active shell pane, invoking OneKey picker shows saved entries
      (both SSH-bound and generic account kinds); picking an entry and choosing
      `Username` types the username into the PTY input (via prompt-editor-aware
      paste path)."
    result: passed
    reason:
      text: "render_onekey_menu (view.rs:7443) wired into render via
        .children(onekey_menu) at :7879; early on_key_down routing at :2532 and
        handle_onekey_key at :5305 drive Stage/handle_key/filtered_entries
        (onekey.rs). cargo test --bin tty7-app onekey: 11 pass incl. 2 view e2e
        tests."
      truncated: false
  - id: A2
    source: brief.md
    text: "A2: Same picker choosing `Password` fills the password without echoing it
      into visible UI beyond masked picker; works when prompt editor is active
      and when raw PTY owns input."
    result: passed
    reason:
      text: fill_onekey (view.rs:3284) routes username via paste and password direct
        to PTY; overlay rows paint title/username/kind only (:7501-7508), never
        password. View e2e fills pw2 to raw PTY with nothing in editor state.
      truncated: false
  - id: A3
    source: brief.md
    text: "A3: Picker offers `Username+Password` (username, then Enter/Tab
      equivalent, then password per spec) as one action; user can cancel with
      Esc without sending bytes."
    result: passed
    reason:
      text: fill_bytes emits user\rpass with no final submit (core/onekey.rs:78-83);
        Esc/Ctrl-G/Ctrl-C map to Cancel (onekey.rs:154). Unit
        cancel_sends_zero_bytes + view
        onekey_escape_cancels_without_touching_the_pty both pass.
      truncated: false
  - id: A4
    source: brief.md
    text: "A4: Entries are manageable (add/edit/delete) and persist across restarts
      via config file; `tty7 ls`-style restart does not lose entries."
    result: passed
    reason:
      text: OneKeyForm (settings.rs:1440) rendered in pages.rs render_onekey_group
        (:1110) with Add/Edit form, 1-64 char + unique-title validation
        (save_onekey_form :2254), per-row Edit/Delete (:1281/:1286), persistence
        via update_config (:2298) and delete_onekey_entry (app.rs:3032).
        settings suite 53 pass; terminal::view 288 pass.
      truncated: false
  - id: A5
    source: brief.md
    text: "A5: Docs/settings surface the WindTerm-derived security warning
      (secure-environment use; config-file secrets are recoverable by local
      readers)."
    result: passed
    reason:
      text: ONEKEY_SECURITY_WARNING defined core/onekey.rs:104, surfaced in Settings
        group (pages.rs:1123) and docs/reference/configuration.mdx:123.
      truncated: false
