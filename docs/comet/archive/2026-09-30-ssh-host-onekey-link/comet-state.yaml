        try_password + all-password keyboard-interactive consume spec.password
        first (prompt only on auth failure). Test
        linked_host_uses_onekey_username_and_password passes.
      truncated: false
  - id: A3
    source: brief.md
    text: "A3: 去 OneKey 里改该条目的密码（或改名），不碰 host，再次连接用新密码成功（live 引用）。"
    result: passed
    reason:
      text: linked_credential resolves entry id live at connect time (no snapshot);
        empty-username/empty-password edge rules keep host user / keychain
        chain. Test link_follows_entry_edits_without_touching_the_host passes.
      truncated: false
  - id: A4
    source: brief.md
    text: "A4: 删除被关联的 OneKey 条目后，连接回退到 host 自身凭证；host 行显示链接失效提示；无崩溃。"
    result: passed
    reason:
      text: Unknown id resolves to None so connect falls back to host credentials;
        is_link_broken drives row hint 'OneKey link broken' and details 'link
        broken (entry missing)'; no error dialog path. Tests
        dangling_link_resolves_to_nothing_and_reports_broken and
        dangling_link_falls_back_to_host_credentials pass.
      truncated: false
  - id: A5
    source: brief.md
    text: "A5: 解除关联后恢复纯 host 凭证行为，与从未关联一致。"
    result: passed
    reason:
      text: onekey_entry_id None (incl. 'No link' + blank-id + old-file serde default)
        yields linked_credential None and is_link_broken false, i.e.
        byte-identical old behavior. Test unlinked_host_ignores_entries passes.
      truncated: false
